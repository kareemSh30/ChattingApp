<div class="relative flex items-center bg-[#1E2128] rounded-xl px-4 py-2.5 shadow-sm border border-slate-700/50 focus-within:border-indigo-500/50 focus-within:ring-1 focus-within:ring-indigo-500/50 transition-all">
  <button class="p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-slate-700/50 rounded-full transition-colors flex-shrink-0" title="Attach file">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <input
    type="text"
    [placeholder]="placeholder"
    class="flex-1 bg-transparent border-none focus:outline-none text-slate-200 placeholder-slate-500 px-3 py-1 mx-1 text-[15px]"
    [disabled]="!channelService.activeChannel() || isSending()"
    [(ngModel)]="messageText"
    (keydown)="onKeyDown($event)" />

  <button
    class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full transition-all duration-200"
    [ngClass]="canSend ? 'bg-indigo-500 text-white hover:bg-indigo-400 shadow-md hover:shadow-indigo-500/30' : 'text-slate-500 hover:text-slate-400 cursor-not-allowed bg-slate-800'"
    [disabled]="!canSend"
    (click)="sendMessage()"
    title="Send">
    @if (isSending()) {
      <span class="loading loading-spinner loading-xs text-white"></span>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 ml-0.5">
        <path d="M3.105 2.288a.75.75 0 0 0-.826.95l1.414 4.926A1.5 1.5 0 0 0 5.135 9.25h6.115a.75.75 0 0 1 0 1.5H5.135a1.5 1.5 0 0 0-1.442 1.086l-1.414 4.926a.75.75 0 0 0 .826.95 28.897 28.897 0 0 0 15.293-7.155.75.75 0 0 0 0-1.114A28.897 28.897 0 0 0 3.105 2.288Z" />
      </svg>
    }
  </button>
</div>
