<div class="flex gap-4 group p-2 hover:bg-slate-800/30 rounded-lg transition-colors" [class.flex-row-reverse]="isOwnMessage()">
  <div class="avatar placeholder flex-shrink-0">
    <div class="bg-indigo-600 text-white rounded-full w-10 h-10 shadow-md">
      <span class="text-lg font-semibold">{{ getAvatarLetter(message().senderUsername) }}</span>
    </div>
  </div>
  
  <div class="flex flex-col min-w-0" [class.items-end]="isOwnMessage()">
    <div class="flex items-baseline gap-2 mb-1" [class.flex-row-reverse]="isOwnMessage()">
      <span class="font-medium text-slate-200 text-sm">{{ message().senderUsername }}</span>
      <span class="text-xs text-slate-500">{{ message().sentAt | date:'shortTime' }}</span>
    </div>
    <div class="px-4 py-2 rounded-2xl max-w-2xl break-words shadow-sm text-[15px] leading-relaxed"
         [ngClass]="isOwnMessage() ? 'bg-indigo-500 text-white rounded-tr-sm' : 'bg-slate-800 text-slate-200 rounded-tl-sm'">
      {{ message().content }}
    </div>
  </div>
</div>
