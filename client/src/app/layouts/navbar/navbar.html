<div class="navbar bg-slate-950 text-white">
  <div class="navbar-start">
    <a routerLink="/" class="btn btn-ghost text-xl">ChattingApp</a>
  </div>
  <div class="navbar-center flex">
    @if (accountService.currentUser()) {
      <ul class="menu menu-horizontal px-1">
        <li><a routerLink="/main-chat">Messages</a></li>
      </ul>
    }
  </div>
  <div class="navbar-end gap-2">

    @if (!accountService.currentUser()) {
      <button class="px-6 py-2 cursor-pointer rounded-lg text-white hover:bg-indigo-600 transition" routerLink="/login">Login</button>
      <button class="px-6 py-2 cursor-pointer rounded-lg text-white bg-indigo-600 hover:bg-indigo-500 transition" routerLink="/register">Register</button>
    } @else {
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="flex items-center gap-2 cursor-pointer px-4 py-2 rounded-lg hover:bg-slate-800 transition">
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold">
            {{ accountService.currentUser()?.username?.charAt(0)?.toUpperCase() }}
          </div>
          <span class="text-sm font-medium">{{ accountService.currentUser()?.username }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
          </svg>
        </div>
        <ul tabindex="0" class="menu menu-sm dropdown-content z-50 mt-2 w-48 rounded-xl border border-slate-700 bg-slate-900 p-2 shadow-xl">
          <li>
            <a routerLink="/main-chat" class="text-slate-300 hover:text-white">
              Messages
            </a>
          </li>
          <li class="divider my-1"></li>
          <li>
            <button (click)="logout()" class="text-red-400 hover:text-red-300">
              Logout
            </button>
          </li>
        </ul>
      </div>
    }
  </div>
</div>
