<div class="chat-layout">

    <!-- SERVERS -->
  
    <aside class="server-sidebar">
  
      <button class="server-btn server-btn--active">
        <svg xmlns="http://www.w3.org/2000/svg" class="server-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 11-1.06 1.06l-8.69-8.69-8.69 8.69a.75.75 0 01-1.06-1.06l8.69-8.69z" />
          <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15.75a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-4.5a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a.426.426 0 00.091-.086L12 5.43z" />
        </svg>
      </button>

      <div class="server-divider"></div>
  
      <button class="server-btn">
        A
      </button>
  
      <button class="server-btn">
        G
      </button>

      <button class="server-btn server-btn--add">
        <svg xmlns="http://www.w3.org/2000/svg" class="server-icon" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M12 3.75a.75.75 0 01.75.75v6.75h6.75a.75.75 0 010 1.5h-6.75v6.75a.75.75 0 01-1.5 0v-6.75H4.5a.75.75 0 010-1.5h6.75V4.5a.75.75 0 01.75-.75z" clip-rule="evenodd" />
        </svg>
      </button>
  
    </aside>
  
    <!-- CHANNELS -->
  
    <app-channel-sidebar class="channel-sidebar"></app-channel-sidebar>
  
    <!-- CHAT -->
  
    <main class="chat-main">
  
      <!-- Header -->
      <app-chat-header></app-chat-header>
      
  
      <!-- Messages -->
      <app-message-input></app-message-input>
  
      <!-- Message Input -->
      <app-message-item></app-message-item>
  
    </main>
  
  </div>
