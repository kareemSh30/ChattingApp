<div class="drawer md:drawer-open h-screen bg-slate-900 overflow-hidden text-slate-200 font-sans">
  <input id="chat-drawer" type="checkbox" class="drawer-toggle" />
  
  <div class="drawer-content flex flex-col h-screen relative">
    
    <!-- Mobile Header Toggler -->
    <div class="md:hidden flex items-center bg-slate-800 p-2 border-b border-slate-700">
      <label for="chat-drawer" class="btn btn-square btn-ghost text-slate-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-6 h-6 stroke-current"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </label>
      <app-chat-header class="flex-1"></app-chat-header>
    </div>

    <!-- Desktop Header -->
    <div class="hidden md:block">
      <app-chat-header></app-chat-header>
    </div>
    
    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-slate-900">
      <app-message-list class="flex-1 flex flex-col"></app-message-list>
    </main>
    
    <!-- Input Area -->
    <div class="p-4 bg-slate-900 border-t border-slate-800">
      <app-message-input></app-message-input>
    </div>
  </div> 
  
  <div class="drawer-side z-[100]">
    <label for="chat-drawer" aria-label="close sidebar" class="drawer-overlay"></label> 
    
    <!-- Sidebars Container -->
    <div class="flex h-screen bg-slate-900 overflow-hidden shadow-2xl md:shadow-none">
      <app-server-sidebar></app-server-sidebar>
      <app-channel-sidebar class="w-64 flex-shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col md:w-64"></app-channel-sidebar>
      <!-- On mobile, channel sidebar is shown, we need it to not be hidden -->
      <!-- Wait, I'll let channel-sidebar control its flex -->
    </div>
  </div>
</div>
