<section class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-slate-700 rounded-2xl shadow-md px-8 py-10">

    <!-- Heading -->
    <h1 class="text-2xl font-bold text-white text-center mb-1">Create an Account</h1>
    <p class="text-sm text-white text-center mb-7">Join us and start your journey</p>

    <!-- Form -->
    <form #registerForm="ngForm" (ngSubmit)="register()">

      <!-- Username -->
      <div class="mb-3">
        <input
          [(ngModel)]="username"
          id="username"
          name="username"
          type="text"
          placeholder="Username"
          required
          class="w-full h-11 px-4 text-sm text-gray-800 bg-white border border-gray-200 rounded-lg placeholder-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition"
        />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <input
          [(ngModel)]="email"
          id="email"
          name="email"
          type="email"
          placeholder="Email Address"
          autocomplete="email"
          required
          class="w-full h-11 px-4 text-sm text-gray-800 bg-white border border-gray-200 rounded-lg placeholder-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition"
        />
      </div>

      <!-- Password -->
      <div class="mb-3 relative">
        <input
          [(ngModel)]="password"
          id="password"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
          required
          class="w-full h-11 px-4 pr-10 text-sm text-gray-800 bg-white border border-gray-200 rounded-lg placeholder-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition"
        />
        <!-- Eye icon -->
        <span class="absolute inset-y-0 right-3 flex items-center text-gray-400 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
        </span>
      </div>



      <!-- Submit -->
      <button
        type="submit"
        class="w-full mt-2 h-11 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold text-sm rounded-lg transition active:scale-95"
      >
        Sign Up
      </button>

    </form>

    <!-- Login -->
    <p class="mt-6 text-sm text-gray-500 text-center">
      Already have an account?
      <a routerLink="/login" class="text-indigo-500 font-medium hover:text-indigo-600">Sign in</a>
    </p>

  </div>
</section>
